name: zoran-v2-ci

# Least-privilege par defaut pour TOUS les jobs (defense en profondeur).
# Chaque job peut re-declarer un scope plus fin si necessaire.
permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["integration/v2-canonical", "main"]

jobs:
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions epinglees sur SHA immuables (anti supply-chain / tag repointable).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install dev deps
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  deps-audit:
    name: Dependances vulnerables (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit des dependances dev
        run: python -m pip_audit -r requirements-dev.txt --strict

  secrets-scan:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # historique complet pour scanner tous les commits
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          # Compte personnel (User) => aucune licence requise. Voir README gitleaks-action.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Analyse statique Python (bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install bandit
        run: python -m pip install bandit
      # -r recursif, exclusion des tests, seuil medium (severite ll + confiance ii)
      # pour limiter le bruit sur un premier passage.
      - name: Bandit scan
        run: python -m bandit -r zoran_v2 -x tests -ll -ii
